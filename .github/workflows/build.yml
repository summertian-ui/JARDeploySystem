name: Build Desktop Packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask paramiko scp pymysql pywebview pyinstaller

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask paramiko scp pymysql pywebview pyinstaller

      - name: Build macOS .app
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --name "JARDeploySystem" \
            --icon assets/app.icns \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --collect-submodules webview \
            --osx-bundle-identifier com.jardeploy.system desktop_app.py

      - name: Build Windows exe
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name "JARDeploySystem" \
            --icon assets/app.ico \
            --add-data "templates;templates" \
            --add-data "static;static" \
            --collect-submodules webview \
            desktop_app.py

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv rpm squashfs-tools \
            libgirepository1.0-dev libcairo2-dev pkg-config gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0
          bash build/build_linux.sh all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/*.app
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.snap
          if-no-files-found: ignore
